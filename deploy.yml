---
# ========== PLAY 1: Build ==========
- name: Build Java application on build node
  hosts: build
  become: yes
  vars:
    build_dir: /opt/build
    repo_url: "https://github.com/spring-guides/gs-spring-boot.git"
    maven_branch: main
    artifact_dir: /tmp/java-artifact

  tasks:
    - name: Install JDK and Maven
      apt:
        name:
          - openjdk-17-jdk
          - maven
        state: present
        update_cache: yes

    - name: Create build workspace
      file:
        path: "{{ build_dir }}"
        state: directory
        mode: '0755'

    - name: Clone sample Spring Boot application
      git:
        repo: "{{ repo_url }}"
        dest: "{{ build_dir }}/app-src"
        version: "{{ maven_branch }}"

    - name: Build application with Maven
      shell: |
        cd {{ build_dir }}/app-src/complete
        mvn clean package -DskipTests
      args:
        chdir: "{{ build_dir }}/app-src/complete"

    - name: Create artifact directory
      file:
        path: "{{ artifact_dir }}"
        state: directory
        mode: '0755'

    - name: Copy built JAR to artifact directory
      copy:
        src: "{{ build_dir }}/app-src/complete/target/spring-boot-complete-0.0.1-SNAPSHOT.jar"
        dest: "{{ artifact_dir }}/app.jar"
        remote_src: yes
        mode: '0644'

    - name: Fetch JAR to control node for production deployment
      fetch:
        src: "{{ artifact_dir }}/app.jar"
        dest: "/tmp/app.jar"
        flat: yes

# ========== PLAY 2: Prod ==========
- name: Deploy and run Java application on prod node
  hosts: prod
  become: yes
  vars:
    app_dir: /opt/java-app
    app_user: javaapp
    app_group: javaapp
    app_jar_local: /tmp/app.jar
    
  tasks:
    - name: Install JRE (runtime only)
      apt:
        name: openjdk-17-jre-headless
        state: present
        update_cache: yes

    - name: Create application group
      group:
        name: "{{ app_group }}"
        state: present

    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /usr/sbin/nologin
        system: yes
        create_home: no

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'

    - name: Copy JAR file to production server
      copy:
        src: "{{ app_jar_local }}"
        dest: "{{ app_dir }}/app.jar"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0644'
      notify: restart java-app

    - name: Deploy systemd service unit
      template:
        src: templates/java-app.service.j2
        dest: /etc/systemd/system/java-app.service
        mode: '0644'
      notify:
        - reload systemd
        - restart java-app

    - name: Ensure java-app service is enabled and started
      systemd:
        name: java-app
        enabled: yes
        state: started
        daemon_reload: yes
        
  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes

    - name: restart java-app
      systemd:
        name: java-app
        state: restarted
